# remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind a send-prefix

bind Z send-keys -R
bind ^a last-window
bind k confirm-before -p "kill-window #W? (y/n)" kill-window
unbind &

# Setup copy mode to be more screen-like
set-window-option -g mode-keys emacs
set-window-option -g remain-on-exit on
bind -T copy-mode ^u send-keys -X page-up
bind -T copy-mode ^d send-keys -X page-down

set -g default-terminal "screen-256color"
if-shell '[[ $(uname -s) = Darwin ]]' {
  if-shell '[[ $(uname -m) = arm64 ]]' {
    set -g default-command "/opt/homebrew/bin/reattach-to-user-namespace -l /Users/coneill/.nix-profile/bin/bash -l"
  }
  if-shell '[[ $(uname -m) = x86_64 ]]' {
    set -g default-command "/usr/local/bin/reattach-to-user-namespace -l /usr/local/bin/bash -l"
  }
}

# Status bar
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold]  #S #[bg=#1a1b26,fg=#7aa2f7] "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]#[bg=#565f89,fg=#c0caf5] %l:%M%p #[fg=#7aa2f7]#[bg=#7aa2f7,fg=#1a1b26,bold] %d-%b "
set -g status-right-length 40

# Window tabs
set -g window-status-format "#[fg=#737aa2] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#9ece6a]#[fg=#1a1b26,bg=#9ece6a,bold] #I:#W #[fg=#9ece6a,bg=#1a1b26]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message style
set -g message-style "bg=#7aa2f7,fg=#1a1b26"

set -g mouse on

set -g base-index 1
bind 0 select-window -t :10

new-session -A -s main
new-window -t main:2
new-window -t main:3
new-window -t main:4
new-window -t main:5
new-window -t main:6
new-window -t main:7
new-window -t main:8
new-window -t main:9
new-window -t main:10
