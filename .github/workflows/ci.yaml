---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
      with:
        name: claytono
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Cache pre-commit
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
      with:
        path: ~/.cache/pre-commit
        key: precommit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          precommit-

    # Hook versions, linter configs, and the dev shell's tools can change
    # results for files a PR doesn't touch, so lint everything when they do.
    - name: Check for lint tooling changes
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
      id: changes
      with:
        filters: |
          tooling:
            - 'flake.nix'
            - 'flake.lock'
            - '.pre-commit-config.yaml'
            - '.markdownlint.yaml'
            - '.shellcheckrc'
            - '.yamlfix.toml'
            - '.yamllint.yaml'
            - '.zizmor.yml'
            - 'scripts/lint'
            - '.github/workflows/ci.yaml'

    - name: Run lint
      run: |
        if [ "$LINT_ALL_FILES" = true ]; then
          nix develop --command ./scripts/lint --all-files
        else
          nix develop --command ./scripts/lint --from-ref "origin/$BASE_REF" --to-ref HEAD
        fi
      env:
        BASE_REF: ${{ github.base_ref || 'main' }}
        LINT_ALL_FILES: ${{ steps.changes.outputs.tooling }}
