---
name: Update Flake Versions

on:
  pull_request:
    paths:
    - flake.nix
    - flake.lock
    - home.nix

concurrency:
  group: flake-versions-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update-versions:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        persist-credentials: false
        ref: ${{ github.head_ref }}
        token: ${{ secrets.PAT }}

    - name: Install Nix
      uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe  # v31
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix
      uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c  # v17
      with:
        name: claytono
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Update flake-versions.yaml
      run: |
        nix develop --command ./scripts/gen-flake-versions --comment-file /tmp/comment.md

        if git diff --quiet flake-versions.yaml; then
          echo "No version changes"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add flake-versions.yaml
        git commit -m "Update flake-versions.yaml"
        git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}" "HEAD:${BRANCH_NAME}"

        if [ -s /tmp/comment.md ]; then
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
        fi
      env:
        PAT: ${{ secrets.PAT }}
        BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        GH_TOKEN: ${{ secrets.PAT }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
