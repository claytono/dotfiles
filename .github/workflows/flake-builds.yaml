---
name: Build Flake Outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-flake-outputs:
    name: Build flake outputs (${{ matrix.label }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
        - label: home-manager (macos arm64)
          runs-on: macos-26
          flake-output: .#homeConfigurations.coneill.activationPackage

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Check for flake changes
      if: github.event_name != 'workflow_dispatch'
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
      id: changes
      with:
        filters: |
          flake:
            - 'flake.nix'
            - 'flake.lock'
            - 'home.nix'
            - '.github/workflows/flake-builds.yaml'

    - name: Install Nix
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.flake
        == 'true'
      uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b  # v31
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.flake
        == 'true'
      uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c  # v17
      with:
        name: claytono
        skipPush: true

    - name: Build
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.flake
        == 'true'
      run: |
        set -o pipefail
        nix build --no-link --print-build-logs --log-format raw --verbose \
          --print-out-paths ${{ matrix.flake-output }} \
          | tee /tmp/flake-output-paths

    - name: Push flake closure to Cachix
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && (github.event_name == 'workflow_dispatch' || steps.changes.outputs.flake
        == 'true')
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      run: |-
        if [ -z "$CACHIX_AUTH_TOKEN" ]; then
          echo "CACHIX_AUTH_TOKEN is not configured for claytono/dotfiles" >&2
          exit 1
        fi

        # Push the activation package closure explicitly so substituted paths
        # like Codex still get uploaded to Cachix on main pushes.
        cachix push claytono < /tmp/flake-output-paths
