---
name: Build Flake Outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-flake-outputs:
    name: Build flake outputs (${{ matrix.label }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: home-manager (macos arm64)
          runs-on: macos-26
          flake-output: .#homeConfigurations.coneill-aarch64-darwin.activationPackage
          codex-output: .#packages.aarch64-darwin.codex
          nix-cores: ''
          extra-swap-size-gb: ''
        - label: home-manager (linux arm64)
          runs-on: ubuntu-24.04-arm
          flake-output: .#homeConfigurations.coneill-aarch64-linux.activationPackage
          codex-output: .#packages.aarch64-linux.codex
          nix-cores: '1'
          extra-swap-size-gb: '8'
        - label: home-manager (linux amd64)
          runs-on: ubuntu-24.04
          flake-output: .#homeConfigurations.coneill-x86_64-linux.activationPackage
          codex-output: .#packages.x86_64-linux.codex
          nix-cores: ''
          extra-swap-size-gb: ''

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Check for flake changes
      if: github.event_name != 'workflow_dispatch'
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
      id: changes
      with:
        filters: |
          flake:
            - 'flake.nix'
            - 'flake.lock'
            - 'home.nix'
            - '.github/workflows/flake-builds.yaml'

    - name: Install Nix
      if: steps.changes.outputs.flake != 'false'
      uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f  # v31
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix
      if: steps.changes.outputs.flake != 'false'
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
      with:
        name: claytono
        skipPush: true

    - name: Start Tailscale SSH
      # Temporary diagnostics for PR 39. Remove after the long-running Codex
      # build is understood.
      if: steps.changes.outputs.flake != 'false'
      uses: claytono/github-actions/tailscale-ssh@ef5adfc30461da4e7f1aad700b1ddfd39b2dbd61
      with:
        oauth-client-id: ${{ secrets.TAILSCALE_SSH_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TAILSCALE_SSH_OAUTH_CLIENT_SECRET }}
        hostname: dotfiles-flake-${{ github.run_id }}-${{ github.run_attempt }}
        mode: background

    - name: Add extra swap
      if: steps.changes.outputs.flake != 'false' && matrix.extra-swap-size-gb != ''
      run: |
        set -euo pipefail

        swap_size_gb='${{ matrix.extra-swap-size-gb }}'
        swapfile=/mnt/github-actions-extra.swap

        sudo fallocate -l "${swap_size_gb}G" "$swapfile"
        sudo chmod 600 "$swapfile"
        sudo mkswap "$swapfile"
        sudo swapon "$swapfile"
        swapon --show

    - name: Build
      if: steps.changes.outputs.flake != 'false'
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      run: |
        set -o pipefail

        flake_output='${{ matrix.flake-output }}'
        codex_output='${{ matrix.codex-output }}'
        nix_cores='${{ matrix.nix-cores }}'
        build_command=(
          nix build
          --no-link
          --keep-going
          --print-out-paths
          --max-jobs 1
        )
        if [ -n "$nix_cores" ]; then
          build_command+=(--cores "$nix_cores")
        fi
        build_command+=("$flake_output" "$codex_output")

        build_output=/tmp/flake-build-output
        output_paths=/tmp/flake-output-paths
        rm -f "$build_output" "$output_paths"

        if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
          echo "CACHIX_AUTH_TOKEN is not configured for claytono/dotfiles" >&2
          exit 1
        fi

        run_command=(
          cachix watch-exec
          --watch-mode post-build-hook
          claytono
          --
          "${build_command[@]}"
        )

        set +e
        "${run_command[@]}" | tee "$build_output"
        build_status=$?
        set -e

        awk '/^\/nix\/store\// { print }' "$build_output" > "$output_paths"
        exit "$build_status"

    - name: Push flake closure to Cachix
      if: steps.changes.outputs.flake != 'false'
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      run: |-
        if [ -z "$CACHIX_AUTH_TOKEN" ]; then
          echo "CACHIX_AUTH_TOKEN is not configured for claytono/dotfiles" >&2
          exit 1
        fi

        if [ ! -s /tmp/flake-output-paths ]; then
          echo "No final flake output paths were produced; live cache upload handled completed paths." >&2
          exit 0
        fi

        # Push final flake output closures explicitly so substituted paths
        # still get uploaded to Cachix on main pushes.
        cachix push claytono < /tmp/flake-output-paths
