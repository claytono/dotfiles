---
name: Build Flake Outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-flake-outputs:
    name: Build flake outputs (${{ matrix.label }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
        - label: home-manager (macos arm64)
          runs-on: macos-26
          flake-output: .#homeConfigurations.coneill.activationPackage

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Check for flake changes
      if: github.event_name != 'workflow_dispatch'
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
      id: changes
      with:
        filters: |
          flake:
            - 'flake.nix'
            - 'flake.lock'
            - 'home.nix'
            - '.github/workflows/flake-builds.yaml'

    - name: Install Nix
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.flake
        == 'true'
      uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b  # v31
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.flake
        == 'true'
      uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c  # v17
      with:
        name: claytono
        skipPush: true

    - name: Build
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.flake
        == 'true'
      run: |
        set -o pipefail

        dump_build_state() {
          echo "::group::Nix build state $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          echo "Active build processes:"
          pgrep -f '[n]ix|[c]argo|[r]ustc|[c]lang|[c]odex' \
            | while IFS= read -r pid; do
              ps -p "$pid" -o pid= -o ppid= -o etime= -o pcpu= -o pmem= -o command=
            done \
            || true

          echo "Active Nix build directories:"
          find /private/tmp -maxdepth 1 -type d -name 'nix-build-*' -print 2>/dev/null \
            | while IFS= read -r build_dir; do
              du -sh "$build_dir" 2>/dev/null || true
            done \
            | tail -20 \
            || true

          echo "Recent Nix build logs:"
          find /nix/var/log/nix/drvs -type f -name '*.bz2' -print 2>/dev/null \
            | while IFS= read -r log_file; do
              printf '%s %s\n' "$(stat -f '%m' "$log_file")" "$log_file"
            done \
            | sort -nr \
            | head -5 \
            | cut -d' ' -f2- \
            | while IFS= read -r log_file; do
              echo "--- ${log_file}"
              bzip2 -dc "$log_file" 2>/dev/null | tail -40 || true
            done \
            || true

          echo "::endgroup::"
        }

        (
          nix build --no-link --print-build-logs --log-format raw --verbose \
            --debug --show-trace \
            --option keep-failed true \
            --option log-lines 200 \
            --print-out-paths ${{ matrix.flake-output }} \
            | tee /tmp/flake-output-paths
        ) &
        build_pid=$!

        while kill -0 "$build_pid" 2>/dev/null; do
          sleep 60
          dump_build_state
        done &
        watchdog_pid=$!

        set +e
        wait "$build_pid"
        build_status=$?
        set -e

        kill "$watchdog_pid" 2>/dev/null || true
        wait "$watchdog_pid" 2>/dev/null || true

        exit "$build_status"

    - name: Push flake closure to Cachix
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && (github.event_name == 'workflow_dispatch' || steps.changes.outputs.flake
        == 'true')
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      run: |-
        if [ -z "$CACHIX_AUTH_TOKEN" ]; then
          echo "CACHIX_AUTH_TOKEN is not configured for claytono/dotfiles" >&2
          exit 1
        fi

        # Push the activation package closure explicitly so substituted paths
        # like Codex still get uploaded to Cachix on main pushes.
        cachix push claytono < /tmp/flake-output-paths
